  - { name: "Google Research",        url: "https://research.google/blog/rss/",                          weight: 1.2 }
  - { name: "DeepMind",               url: "https://deepmind.google/blog/rss.xml",                       weight: 1.2 }
  - { name: "OpenAI News",            url: "https://openai.com/news/rss.xml",                            weight: 1.1 }
  - { name: "Mistral",                url: "https://mistral.ai/rss.xml",                                weight: 1.1 }
  - { name: "Qwen",                   url: "https://qwenlm.github.io/blog/index.xml",                    weight: 1.4 }
  - { name: "Sebastian Raschka",      url: "https://magazine.sebastianraschka.com/feed",                 weight: 1.5 }
  - { name: "Simon Willison",         url: "https://simonwillison.net/atom/everything/",                 weight: 1.2 }
  - { name: "Lil-Log",                url: "https://lilianweng.github.io/index.xml",                     weight: 1.4 }
  - { name: "PyTorch Blog",           url: "https://pytorch.org/blog/feed.xml",                          weight: 1.1 }
  - { name: "vLLM Releases",         url: "https://github.com/vllm-project/vllm/releases.atom",         weight: 1.2 }
  - { name: "r/LocalLLaMA",           url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day",         weight: 1.3 }
  - { name: "r/MachineLearning",      url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=day",    weight: 1.0 }
  - { name: "Ollama Releases",        url: "https://github.com/ollama/ollama/releases.atom",             weight: 1.2 }
  - { name: "Axolotl Releases",       url: "https://github.com/axolotl-ai-cloud/axolotl/releases.atom",  weight: 1.5 }
  - { name: "Unsloth Releases",       url: "https://github.com/unslothai/unsloth/releases.atom",         weight: 1.5 }
  - { name: "LLaMA-Factory Releases", url: "https://github.com/hiyouga/LLaMA-Factory/releases.atom",     weight: 1.5 }
  - { name: "TRL Releases",           url: "https://github.com/huggingface/trl/releases.atom",           weight: 1.5 }
  - { name: "torchtune Releases",     url: "https://github.com/pytorch/torchtune/releases.atom",         weight: 1.4 }
  - { name: "verl Releases",          url: "https://github.com/volcengine/verl/releases.atom",           weight: 1.4 }
  - { name: "OpenRLHF Releases",      url: "https://github.com/OpenRLHF/OpenRLHF/releases.atom",         weight: 1.4 }
  - { name: "llama.cpp Releases",     url: "https://github.com/ggml-org/llama.cpp/releases.atom",        weight: 1.1 }
  - { name: "distilabel Releases",    url: "https://github.com/argilla-io/distilabel/releases.atom",     weight: 1.5 }
  - { name: "SWE-bench",              url: "https://github.com/SWE-bench/SWE-bench/releases.atom",       weight: 1.3 }
  - { name: "PEFT Releases",          url: "https://github.com/huggingface/peft/releases.atom",          weight: 1.5 }
  - { name: "mergekit Releases",      url: "https://github.com/arcee-ai/mergekit/releases.atom",         weight: 1.5 }
  - { name: "lm-eval-harness",        url: "https://github.com/EleutherAI/lm-evaluation-harness/releases.atom", weight: 1.3 }
  - { name: "SGLang Releases",        url: "https://github.com/sgl-project/sglang/releases.atom",        weight: 1.2 }

arxiv:
  enabled: true
  weight: 1.2
  max_results: 80
  # OR-ed together, each searched over title+abstract in the lookback window.
  queries:
    - "knowledge distillation language model"
    - "teacher student distillation LLM"
    - "synthetic data generation code LLM"
    - "reinforcement learning verifiable rewards code"
    - "supervised fine-tuning code model"
    - "model merging large language model"
    - "self-improvement language model training"
    - "curriculum learning code generation"

github:
  enabled: true
  weight: 1.3
  # Free-text repo search; a recency qualifier is appended automatically.
  queries:
    - "distillation LLM"
    - "fine-tuning framework LLM"
    - "synthetic data generation LLM"
    - "GRPO trainer"
    - "model merging llm"
    - "code model training"
  min_stars: 25

hackernews:
  enabled: true
  weight: 1.0
  queries:
    - "distillation"
    - "fine-tune LLM"
    - "training LLM"
    - "coding model"
  min_points: 30

huggingface:
  enabled: true
  weight: 1.4
  # New/updated models to consider as *teacher* candidates for a coder model.
  model_queries: ["coder", "code", "distill", "instruct", "reasoning", "leaked"]
  max_models: 120
  # Ignore anything that cannot plausibly run or teach on this rig.
  max_params_b: 200
  papers: true
  # Cap how many models one run may contribute, best-fitness first.
  keep_models: 25
